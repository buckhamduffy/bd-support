name: Release
on:
    push:
        branches:
            - main

permissions:
    contents: write
    discussions: write
    packages: write

concurrency:
    group: release-${{github.ref}}
    cancel-in-progress: true

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 0

            - uses: buckhamduffy/release-drafter@20021c8ddccbc28fc87056f2f660772ad59cec47 # v1.6.1
              id: version
              with:
                  master_branch: main
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
